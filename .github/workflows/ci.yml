name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: crates/lattice-server/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/lattice-server/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: crates/lattice-server/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Run frontend typecheck
        working-directory: crates/lattice-server/frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: crates/lattice-server/frontend
        run: npm run test

      - name: Run frontend build
        working-directory: crates/lattice-server/frontend
        run: npm run build

      - name: Run frontend browser tests
        working-directory: crates/lattice-server/frontend
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            crates/lattice-server/frontend/playwright-report
            crates/lattice-server/frontend/test-results
          if-no-files-found: ignore
