name: Topology Reflection Push

on:
  push:
    branches:
      - main

jobs:
  topology-reflection-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      TOPOLOGY_REFLECTION_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/topology-reflection

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: crates/lattice-server/frontend/package-lock.json

      - name: Install npm
        run: npm install --global npm@11.11.0

      - name: Install frontend dependencies
        working-directory: crates/lattice-server/frontend
        run: npm ci

      - name: Install containerlab
        run: |
          curl -sL https://get.containerlab.dev | sudo -E bash
          containerlab version

      - name: Build lattice-server
        run: cargo build -p lattice-server

      - name: Run push topology reflection suite
        run: ./scripts/topology-reflection/run-suite.sh push

      - name: Upload topology reflection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-reflection-push
          path: artifacts/topology-reflection
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: topology-reflection-push-playwright
          path: |
            crates/lattice-server/frontend/playwright-report
            crates/lattice-server/frontend/test-results
          if-no-files-found: ignore
