<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lattice</title>
    <meta name="theme-color" content="#f4f6f8" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <header class="chrome">
        <div class="chrome__brand">
          <div class="brand-mark" aria-hidden="true">L</div>
          <div>
            <p class="eyebrow">Network topology viewer</p>
            <h1>Lattice</h1>
          </div>
        </div>
        <div class="chrome__actions">
          <button type="button" class="action action--primary" data-action="discover">
            再探索
          </button>
          <button type="button" class="action" data-action="reload">
            再読込
          </button>
        </div>
      </header>

      <section class="status-strip" aria-live="polite">
        <div class="status-strip__item">
          <span class="status-strip__label">状態</span>
          <span class="status-pill" data-role="status-pill">loading</span>
        </div>
        <div class="status-strip__item">
          <span class="status-strip__label">更新</span>
          <span data-role="status-message">初期化中</span>
        </div>
        <div class="status-strip__item">
          <span class="status-strip__label">構成</span>
          <span data-role="summary">0 devices / 0 links</span>
        </div>
      </section>

      <div class="workspace">
        <aside class="sidebar">
          <section class="panel panel--info">
            <div class="panel__header">
              <h2>構成</h2>
            </div>
            <div id="tree" class="tree" role="tree" aria-label="scene navigation"></div>
          </section>
        </aside>

        <section class="viewport">
          <div class="viewport__scene" id="scene-host" aria-label="3D network topology view"></div>
          <div class="viewport__empty" data-role="empty-state">
            <div class="empty-card">
              <p class="empty-card__title">Topology is warming up</p>
              <p class="empty-card__body">
                初回探索の結果を待っています。完了後に 3D 構成図と操作ペインへ切り替わります。
              </p>
            </div>
          </div>
          <div class="hover-card" data-role="hover-card" hidden>
            <div class="hover-card__title" data-role="hover-title"></div>
            <div class="hover-card__body" data-role="hover-body"></div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
