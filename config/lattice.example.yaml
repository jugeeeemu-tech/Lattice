server:
  host: "127.0.0.1"
  port: 8080

discovery:
  max_hops: 10
  timeout_seconds: 5
  retries: 2
  concurrent_devices: 1

sources:
  - kind: "snmp"
    version: "2c"
    community: "public"
    seeds:
      - ip: "192.0.2.10"
        label: "vyos-core"

  - kind: "proxmox"
    base_url: "https://192.168.10.50:8006"
    token_id: "${LATTICE_PROXMOX_TOKEN_ID}"
    token_secret: "${LATTICE_PROXMOX_TOKEN_SECRET}"
    tls_verify: true
