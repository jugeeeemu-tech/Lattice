[workspace]
members = [
    "crates/lattice-core",
    "crates/lattice-server",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
snmp = "0.2"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
